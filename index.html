<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Netflix Mobile Navigation</title>
</head>

<body>
  <button class="nav-btn open-btn" aria-label="Open menu" aria-controls="menu" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <img src="logo.svg" alt="Demo logo" class="logo">

  <p class="text">Mobile Navigation</p>

  <nav class="nav nav-black" id="menu" aria-label="Main menu" inert>
    <div class="nav nav-red">
      <div class="nav nav-white">
        <button class="nav-btn close-btn" aria-label="Close menu">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>

        <img src="logo.svg" alt="Demo logo" class="logo">

        <ul class="list">
          <li><a href="https://jobs.netflix.com/teams" target="_blank" rel="noopener noreferrer">Teams</a></li>
          <li><a href="https://jobs.netflix.com/locations" target="_blank" rel="noopener noreferrer">Locations</a></li>
          <li><a href="https://jobs.netflix.com/culture" target="_blank" rel="noopener noreferrer">Life at Netflix</a></li>
          <li>
            <ul>
              <li><a href="https://jobs.netflix.com/culture" target="_blank" rel="noopener noreferrer">Netflix culture memo</a></li>
              <li><a href="https://jobs.netflix.com/culture" target="_blank" rel="noopener noreferrer">Work life balance</a></li>
              <li><a href="https://about.netflix.com/en/inclusion" target="_blank" rel="noopener noreferrer">Inclusion &amp; diversity</a></li>
              <li><a href="https://netflixtechblog.com" target="_blank" rel="noopener noreferrer">Blog</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <script src="script.js"></script>
</body>

</html>
